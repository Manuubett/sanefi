<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>List Your Property - HomeLink Kenya</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="navbar-root"></div>

<section class="form-page">
  <h1>List Your Property</h1>
  <p class="form-subtitle">Reach thousands of renters across Kenya. It only takes a few minutes.</p>

  <p class="alert alert-error" id="signed-out-notice" style="display:none;">
    You need to <a href="login.html">log in</a> before listing a property.
  </p>
  <p class="alert alert-error" id="form-error" style="display:none;"></p>
  <p class="alert alert-success" id="form-success" style="display:none;"></p>

  <form class="listing-form" id="listing-form">
    <div class="form-row">
      <label>Title
        <input type="text" name="title" placeholder="e.g. 2 Bedroom Apartment" required>
      </label>
      <label>Listing Type
        <select name="listingType">
          <option>For Rent</option>
          <option>For Sale</option>
        </select>
      </label>
    </div>

    <div class="form-row">
      <label>Property Type
        <select name="type">
          <option>Apartment</option>
          <option>Bedsitter</option>
          <option>House</option>
          <option>Studio</option>
        </select>
      </label>
      <label>Price (KSh / month)
        <input type="number" name="price" min="0" placeholder="25000" required>
      </label>
    </div>

    <div class="form-row">
      <label>Location
        <input type="text" name="location" placeholder="e.g. Kilimani, Nairobi" required>
      </label>
      <label>County
        <input type="text" name="county" placeholder="e.g. Nairobi" required>
      </label>
    </div>

    <div class="form-row form-row-3">
      <label>Bedrooms <input type="number" name="bedrooms" min="0" value="1"></label>
      <label>Bathrooms <input type="number" name="bathrooms" min="0" value="1"></label>
      <label>Parking <input type="number" name="parking" min="0" value="0"></label>
    </div>

    <label class="full-width">Description
      <textarea name="description" rows="4" placeholder="Describe the property..."></textarea>
    </label>

    <label class="full-width">Your contact (phone or email, shown to renters)
      <input type="text" name="ownerContact" placeholder="e.g. 07XX XXX XXX" required>
    </label>

    <label class="full-width">Photos
      <input type="file" name="photos" id="photos-input" accept="image/*" multiple>
      <small>Uploaded to Cloudinary automatically when you submit.</small>
    </label>

    <button type="submit" class="btn-primary btn-large" id="submit-btn">Publish Listing</button>
  </form>
</section>

<div id="footer-root"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>
<script src="nav.js"></script>
<script src="footer.js"></script>
<script src="property-card.js"></script>
<script src="list-property.js"></script>

</body>
</html>
