<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saved Properties - HomeLink Kenya</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="navbar-root"></div>
<section class="page-header">
  <h1>Saved Properties</h1>
  <p class="form-subtitle">Properties you've hearted, kept on this device.</p>
</section>
<section class="featured">
  <div class="property-grid" id="saved-grid">
    <p class="empty-state">Loading saved properties&hellip;</p>
  </div>
</section>
<div id="footer-root"></div>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="nav.js"></script>
<script src="footer.js"></script>
<script src="saved.js"></script>
<script src="property-card.js"></script>
<script>
renderNavbar(null);
renderFooter();

const savedGrid = document.getElementById("saved-grid");
const ids = getSavedIds();

if (ids.length === 0) {
  savedGrid.innerHTML = `<p class="empty-state">You haven't saved any properties yet. <a href="properties.html">Browse properties</a> and tap the heart on ones you like.</p>`;
} else {
  Promise.all(ids.map((id) => db.collection("propertiess").doc(id).get()))
    .then((docs) => {
      const validDocs = docs.filter((doc) => doc.exists);
      if (validDocs.length === 0) {
        savedGrid.innerHTML = `<p class="empty-state">Your saved properties are no longer available. <a href="properties.html">Browse properties</a>.</p>`;
        return;
      }
      savedGrid.innerHTML = validDocs.map((doc) => propertyCardHTML(doc.id, doc.data())).join("");
      attachHeartHandlers(savedGrid);
    })
    .catch((err) => {
      console.error(err);
      savedGrid.innerHTML = `<p class="empty-state">Couldn't load saved properties right now.</p>`;
    });
}
</script>
</body>
</html>
