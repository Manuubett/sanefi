<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Sanefi Consult</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="navbar-root"></div>

<section class="page-header">
  <h1>Admin &mdash; Review Listings</h1>
  <p class="form-subtitle">Approve or reject new listings before they go live, manage featured properties, and remove anything that shouldn't be on the site.</p>
</section>

<section class="featured">
  <div id="admin-status"></div>
  <div class="dashboard-stats" id="dashboard-stats"></div>
  <div class="dashboard-toplists" id="dashboard-toplists"></div>
  <input type="text" id="admin-search" class="admin-search-input" placeholder="Search by property title&hellip;">
  <div class="admin-tabs" id="admin-tabs"></div>
  <div class="admin-list" id="admin-list"></div>
</section>

<!-- Edit Listing Modal -->
<div id="edit-modal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <h2>Edit Listing</h2>
    <form id="edit-form">
      <label>Title
        <input type="text" id="edit-title" required>
      </label>
      <label>Location
        <input type="text" id="edit-location">
      </label>
      <label>Price (KSh)
        <input type="number" id="edit-price" min="0">
      </label>
      <label>Description
        <textarea id="edit-description" rows="4"></textarea>
      </label>
      <label>Image URLs (one per line)
        <textarea id="edit-imageUrls" rows="3"></textarea>
      </label>
      <label>Poster Name
        <input type="text" id="edit-ownerName">
      </label>
      <label>Poster Contact
        <input type="text" id="edit-ownerContact">
      </label>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="edit-cancel-btn">Cancel</button>
        <button type="submit" class="btn-primary" id="edit-save-btn">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<div id="footer-root"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="nav.js"></script>
<script src="footer.js"></script>
<script src="property-card.js"></script>
<script src="admin.js"></script>
</body>
</html>
